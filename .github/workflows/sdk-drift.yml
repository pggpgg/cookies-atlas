name: SDK drift check

# Weekly: download Axeptio's sdk.js, then
#  1. compare the parts Cookies Atlas mirrors (region table, regulation enum, selection code
#     fingerprints) with sdk-snapshot/snapshot.json, and
#  2. replay the SDK's own selection code against the engine on ~100k visitor scenarios.
# Opens (or updates) an issue labelled sdk-drift when either one finds a difference, or when the
# check itself can't run (sdk.js unreachable, extraction broken).
on:
  schedule:
    - cron: '23 9 * * 1' # Mondays, 09:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # keep the schedule alive (see the last step)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare sdk.js with the snapshot
        id: drift
        run: node scripts/sdk-drift/run.mjs --compare sdk-snapshot/snapshot.json --out drift
      - name: Replay the live SDK against the engine
        id: live
        continue-on-error: true
        run: |
          set -o pipefail
          SDK_LIVE=1 npx vitest run tests/sdk-live.test.mjs 2>&1 | tee drift/live.txt
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-drift
          path: drift/
          if-no-files-found: ignore
      - name: Open or update the drift issue
        # failure() also catches a broken setup (checkout, npm ci) before the check could run.
        if: always() && (failure() || steps.drift.outputs.changed == 'true' || steps.live.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # gh works even if checkout failed
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p drift
          {
            if [ -f drift/report.md ]; then
              cat drift/report.md
            else
              echo "## Cookies Atlas SDK drift check"
              echo
              echo "The check failed before writing a report: see the run logs."
            fi
            if [ "$LIVE_OUTCOME" = "failure" ] && [ -f drift/live.txt ]; then
              echo
              echo "### Live replay: the engine and sdk.js disagree"
              echo
              echo '```'
              tail -n 80 drift/live.txt
              echo '```'
            fi
            echo
            echo "Run: $RUN_URL"
          } > drift/issue.md
          gh label create sdk-drift --color FBCA04 --description "Axeptio's SDK changed" --force
          existing=$(gh issue list --label sdk-drift --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file drift/issue.md
          else
            gh issue create --title "Axeptio's SDK changed: check Cookies Atlas" --label sdk-drift --body-file drift/issue.md
          fi
      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling this one each week resets that clock.
      - name: Keep the weekly schedule alive
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sdk-drift.yml/enable"
